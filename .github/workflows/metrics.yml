name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate classic profile
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.classic.svg
          base: header, repositories
          output_action: commit
          committer_token: ${{ github.token }}
          committer_branch: ${{ github.ref_name }}
          plugin_lines: yes

      - name: Generate isometric commit calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.plugin.isocalendar.fullyear.svg
          base: ""
          output_action: commit
          committer_token: ${{ github.token }}
          committer_branch: ${{ github.ref_name }}
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Generate featured repositories
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.plugin.repositories.svg
          base: ""
          output_action: commit
          committer_token: ${{ github.token }}
          committer_branch: ${{ github.ref_name }}
          plugin_repositories: yes
          plugin_repositories_featured: Sh1n1230/security-checker,Sh1n1230/prohairesis,Sh1n1230/SpotifyEmbedded

      - name: Generate language activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.plugin.languages.svg
          base: ""
          output_action: commit
          committer_token: ${{ github.token }}
          committer_branch: ${{ github.ref_name }}
          plugin_languages: yes
          plugin_languages_limit: 4
          plugin_languages_ignored: html,css